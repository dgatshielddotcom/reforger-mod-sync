name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: .\src\Build.ps1
      - name: Test
        run: .\tests\Run-Tests.ps1
      - name: Upload app
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ReforgerModSync-Windows
          path: |
            ReforgerModSync.exe
            instructions.txt
          if-no-files-found: error
          retention-days: 14
